name: V5 correctness (no training)
on:
  push:
    branches: [v5-unified-temporal-tokens]
    paths: ['v5/**', '.github/workflows/v5-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'pandas>=2,<4' 'matplotlib>=3.7,<4'
      - name: Syntax and correctness checks
        run: |
          python -m compileall -q v5
          python -m unittest discover -s v5/tests -v
